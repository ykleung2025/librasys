    <!-- 系統設定 Drawer -->
    <footer class="mt-12 text-center text-xs text-slate-400 p-4">
        <button onclick="toggleConfig()" class="underline hover:text-slate-600">進階系統設定</button>
        <div id="configPanel" class="hidden max-w-md mx-auto mt-4 p-4 bg-white rounded-xl border text-left space-y-3 shadow-md">
            <div>
                <label class="block text-slate-600 font-semibold mb-1">Google Apps Script URL:</label>
                <input type="text" id="gasUrlInput" class="w-full border p-2 rounded text-xs" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <button onclick="saveConfig()" class="w-full bg-slate-800 text-white py-2 rounded text-xs font-semibold">儲存連結</button>
        </div>
    </footer>

    <script>
        const DEFAULT_GAS_URL = 'https://script.google.com/macros/s/AKfycbxF_jZZgITHU0UfFigeKcNc1B-Qp45CKnetghAj-8aqXmaNvyfkS8i-sAThBjaQLrRi/exec';
        let GAS_URL = localStorage.getItem('GAS_URL') || DEFAULT_GAS_URL;

        window.onload = () => {
            document.getElementById('gasUrlInput').value = GAS_URL;
        };

        function toggleConfig() {
            document.getElementById('configPanel').classList.toggle('hidden');
        }

        function saveConfig() {
            GAS_URL = document.getElementById('gasUrlInput').value.trim() || DEFAULT_GAS_URL;
            localStorage.setItem('GAS_URL', GAS_URL);
            alert('試算表連結已更新！');
            toggleConfig();
        }

        function switchTab(tab) {
            if (tab === 'borrow') {
                document.getElementById('view-borrow').classList.remove('hidden');
                document.getElementById('view-admin').classList.add('hidden');
                document.getElementById('tab-borrow-btn').classList.replace('hover:bg-indigo-700', 'bg-indigo-800');
                document.getElementById('tab-admin-btn').classList.replace('bg-indigo-800', 'hover:bg-indigo-700');
            } else {
                document.getElementById('view-borrow').classList.add('hidden');
                document.getElementById('view-admin').classList.remove('hidden');
                document.getElementById('tab-admin-btn').classList.replace('hover:bg-indigo-700', 'bg-indigo-800');
                document.getElementById('tab-borrow-btn').classList.replace('bg-indigo-800', 'hover:bg-indigo-700');
            }
        }

        // Canvas 影像預處理：轉灰階、提高對比度與銳利度
        function preprocessImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        
                        let width = img.width;
                        let height = img.height;
                        const maxDim = 1800;
                        if (width > maxDim || height > maxDim) {
                            if (width > height) {
                                height = Math.round((height * maxDim) / width);
                                width = maxDim;
                            } else {
                                width = Math.round((width * maxDim) / height);
                                height = maxDim;
                            }
                        }
                        
                        canvas.width = width;
                        canvas.height = height;
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        const imageData = ctx.getImageData(0, 0, width, height);
                        const data = imageData.data;
                        const contrast = 1.35;
                        const intercept = 128 * (1 - contrast);

                        for (let i = 0; i < data.length; i += 4) {
                            let gray = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
                            gray = gray * contrast + intercept;
                            gray = Math.min(255, Math.max(0, gray));
                            data[i] = gray;
                            data[i + 1] = gray;
                            data[i + 2] = gray;
                        }
                        ctx.putImageData(imageData, 0, 0);
                        resolve(canvas.toDataURL('image/jpeg', 0.95));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        // (1) 處理書籍封面拍照
        async function handleBookImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const previewBox = document.getElementById('bookPreviewBox');
            const previewImg = document.getElementById('bookPreviewImg');
            const loading = document.getElementById('bookOcrLoading');
            
            previewImg.src = URL.createObjectURL(file);
            previewBox.classList.remove('hidden');
            loading.classList.remove('hidden');

            try {
                const processedImg = await preprocessImage(file);
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('超時')), 5000));
                const ocrPromise = (async () => {
                    const worker = await Tesseract.createWorker('chi_tra+eng');
                    const ret = await worker.recognize(processedImg);
                    await worker.terminate();
                    return ret.data.text;
                })();

                const text = await Promise.race([ocrPromise, timeoutPromise]);
                const lines = text.split('\n').map(l => l.replace(/[^\w\u4e00-\u9fa5\s《》-]/g, '').trim()).filter(l => l.length >= 2);
                if (lines.length > 0) {
                    document.getElementById('bookTitleInput').value = lines[0];
                }
            } catch (err) {
                console.warn('書籍 OCR 自動跳過：', err.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // (2) 處理學生證拍照
        async function handleIdImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const previewBox = document.getElementById('idPreviewBox');
            const previewImg = document.getElementById('idPreviewImg');
            const loading = document.getElementById('idOcrLoading');
            
            previewImg.src = URL.createObjectURL(file);
            previewBox.classList.remove('hidden');
            loading.classList.remove('hidden');

            try {
                const processedImg = await preprocessImage(file);
                const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('超時')), 5000));
                const ocrPromise = (async () => {
                    const worker = await Tesseract.createWorker('chi_tra+eng');
                    const ret = await worker.recognize(processedImg);
                    await worker.terminate();
                    return ret.data.text;
                })();

                const text = await Promise.race([ocrPromise, timeoutPromise]);
                const lines = text.split('\n').map(l => l.replace(/[^\w\u4e00-\u9fa5\s]/g, '').trim()).filter(l => l.length >= 2);
                if (lines.length > 0) {
                    document.getElementById('borrowerNameInput').value = lines[0];
                }
            } catch (err) {
                console.warn('學生證 OCR 自動跳過：', err.message);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // 送出借書資料
        async function submitBorrow() {
            const bookTitle = document.getElementById('bookTitleInput').value.trim();
            const borrowerName = document.getElementById('borrowerNameInput').value.trim();
            const errorDiv = document.getElementById('borrowError');

            if (!bookTitle || !borrowerName) {
                errorDiv.innerText = "請輸入或拍攝書名與借書人姓名！";
                errorDiv.classList.remove('hidden');
                return;
            }

            const btn = document.getElementById('btnConfirmBorrow');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> 儲存中...';

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        action: 'borrow',
                        bookTitle: bookTitle,
                        borrowerName: borrowerName
                    })
                });

                const res = await response.json();

                if (res.status === 'success') {
                    alert(res.message);
                    // 清空輸入
                    document.getElementById('bookTitleInput').value = '';
                    document.getElementById('borrowerNameInput').value = '';
                    document.getElementById('bookPreviewBox').classList.add('hidden');
                    document.getElementById('idPreviewBox').classList.add('hidden');
                    errorDiv.classList.add('hidden');
                } else {
                    errorDiv.innerText = res.message;
                    errorDiv.classList.remove('hidden');
                }
            } catch (err) {
                errorDiv.innerText = "無法連接到資料庫，請檢查 GAS 部署權限！";
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-check-circle"></i> 確認辦理借書';
            }
        }

        // 管理員登入驗證
        function checkPassword() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === '1212') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-content').classList.remove('hidden');
                fetchBorrowRecords();
            } else {
                alert('密碼錯誤！');
            }
        }

        // 獲取借閱記錄
        async function fetchBorrowRecords() {
            const tbody = document.getElementById('recordsTableBody');
            tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400"><i class="fa-solid fa-spinner animate-spin"></i> 載入資料中...</td></tr>';

            try {
                const res = await fetch(GAS_URL);
                const rawText = await res.text();
                let result;
                try {
                    result = JSON.parse(rawText);
                } catch (e) {
                    throw new Error("GAS 回傳非 JSON 格式！請確認 Apps Script 部署權限是否設為「任何人 (Anyone)」。");
                }

                if (result.status === 'success' && result.data.length > 0) {
                    tbody.innerHTML = result.data.map(item => `
                        <tr class="hover:bg-slate-50">
                            <td class="p-4 font-semibold text-slate-800">《${item.bookTitle}》</td>
                            <td class="p-4 text-slate-600">${item.borrowerName}</td>
                            <td class="p-4 text-slate-500 text-xs">${item.borrowDate} <span class="text-indigo-600">(${item.status})</span></td>
                            <td class="p-4 text-center space-x-2">
                                <button onclick="handleAction('renew', '${item.id}')" class="px-2.5 py-1 bg-amber-100 text-amber-700 hover:bg-amber-200 rounded text-xs font-medium">續借</button>
                                <button onclick="handleAction('return', '${item.id}')" class="px-2.5 py-1 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 rounded text-xs font-medium">已還書</button>
                            </td>
                        </tr>
                    `).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-slate-400">目前沒有借出中的記錄。</td></tr>';
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-rose-500 font-medium">❌ 載入失敗：${err.message}</td></tr>`;
            }
        }

        // 還書 (刪除) 與 續借 (更新)
        async function handleAction(action, id) {
            const confirmMsg = action === 'return' ? '確認已還書？此記錄將從資料庫中刪除。' : '確認辦理續借？';
            if (!confirm(confirmMsg)) return;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: action, id: id })
                });

                const res = await response.json();
                alert(res.message);
                fetchBorrowRecords();
            } catch (err) {
                alert('操作失敗：' + err.message);
            }
        }
    </script>
</body>
</html>"""

with open("index.html", "w", encoding="utf-8") as f:
    f.write(html_content)

print("Generated clean index.html!")
